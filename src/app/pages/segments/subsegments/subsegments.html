<app-navbar></app-navbar>

<section class="subsegments-hero">
  <div class="page-shell subsegments-hero__inner">
    <nav class="subsegments-breadcrumb" aria-label="breadcrumb">
      <a class="crumb" routerLink="/">Inicio</a>
      <span class="sep">›</span>
      <a class="crumb" routerLink="/segments">Melhores empresas</a>
      <span class="sep">›</span>
      <span class="current">Agencias de Modelo</span>
    </nav>

    <h1 class="subsegments-title">Mejores Empresas de Agencias de Modelo</h1>
    <p class="subsegments-subtitle">Descubre quiénes son los mejores y peores en Agencias de Modelo</p>
  </div>
</section>

<section class="subsegments-filters" aria-label="Filtros">
  <div class="page-shell subsegments-filters__inner">
    <div class="subsegments-filters__spacer" aria-hidden="true"></div>

    <div class="subsegments-tabs" role="tablist" aria-label="Ranking">
      <button class="subsegments-tab" type="button" role="tab" aria-selected="false">
        <span class="subsegments-tab__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l7 4v6c0 5-3 9-7 10-4-1-7-5-7-10V6l7-4z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </span>
        Verificadas
      </button>
      <button class="subsegments-tab is-active" type="button" role="tab" aria-selected="true">Melhores</button>
      <button class="subsegments-tab" type="button" role="tab" aria-selected="false">Piores</button>
    </div>

    <form class="subsegments-search" role="search">
      <label for="subsegments-search" class="sr-only">Pesquisar por uma empresa</label>
      <input id="subsegments-search" type="search" placeholder="Pesquise por uma empresa" />
      <button type="submit" aria-label="Pesquisar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>
    </form>
  </div>
</section>
<app-footer></app-footer>
