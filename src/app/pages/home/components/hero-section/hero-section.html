<section class="hero-section" aria-label="Presentacion principal">
  <div class="hero-section__body page-shell">
    <div class="hero-section__logo" aria-hidden="true"></div>

    <div class="hero-section__content">
      <h1>Queja Cierta te acerca a marcas con confianza del consumidor</h1>
      <p>Compra de forma mas segura, investigando empresas y buscando soluciones para cada problema.</p>

      <div class="hero-section__actions">
        @for (actionCard of actionCards; track actionCard.id) {
          <app-hero-action-card
            [icon]="actionCard.icon"
            [text]="actionCard.text"
            [ariaLabel]="actionCard.ariaLabel"
            (cardClick)="onActionClick(actionCard.id)"
          ></app-hero-action-card>
        }
      </div>
    </div>

    <div class="hero-section__logo" aria-hidden="true"></div>
  </div>
</section>
