<app-navbar (createAccountRequested)="openModal()"></app-navbar>

@if (feedbackMessage) {
  <p
    class="home-feedback page-shell"
    [class.home-feedback--error]="feedbackType === 'error'"
    [class.home-feedback--success]="feedbackType === 'success'"
    role="status"
    aria-live="polite"
  >
    {{ feedbackMessage }}
  </p>
}

<main id="main-content">
  <app-hero-section></app-hero-section>
  <app-main-content></app-main-content>
  <app-add></app-add>
  <app-best-discounts-section></app-best-discounts-section>
  <app-add></app-add>
  <app-customer-reviews-section></app-customer-reviews-section>
  <app-add></app-add>
  <app-business-solutions-section></app-business-solutions-section>
</main>

<app-footer></app-footer>

@if (showModal) {
  <app-signup-type-modal (close)="closeModal()" (submit)="onCreateUser($event)" />
}
