<header class="header">
  <div class="logo-container">
    <span class="logo-text">Queja<span class="logo-highlight">Cierta</span></span>
  </div>

  <div class="search-bar-container">
    <div class="search-wrapper">
      <input 
        type="text" 
        placeholder="¿Qué estás buscando?" 
        class="search-input" 
      />
      <button class="search-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fed531" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="auth-buttons">
    <button class="btn btn-login">Iniciar sesión</button>
    <button class="btn btn-register" (click)="openModal()">Crear cuenta</button>
  </div>
</header>

<!-- Modal -->
<app-acc-create 
  *ngIf="showModal"
  (close)="closeModal()"
  (submit)="onCreateUser($event)"
></app-acc-create>

<app-second-bar></app-second-bar>
