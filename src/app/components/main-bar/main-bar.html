<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>Crear Cuenta</h2>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit($event)">
      <div class="form-group">
        <label for="full_name">Nombre completo</label>
        <input 
          id="full_name" 
          formControlName="full_name" 
          type="text" 
          placeholder="Escribe tu nombre completo"
        />
        <div *ngIf="form.get('full_name')?.invalid && form.get('full_name')?.touched" class="error">
          El nombre completo es obligatorio (mínimo 3 caracteres)
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          id="email" 
          formControlName="email" 
          type="email" 
          placeholder="tu@email.com"
        />
        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error">
          Correo electrónico inválido
        </div>
      </div>

      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input 
          id="username" 
          formControlName="username" 
          type="text" 
          placeholder="tu usuario"
        />
        <div *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="error">
          Nombre de usuario obligatorio (mínimo 4 caracteres)
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-submit" [disabled]="form.invalid">Crear Cuenta</button>
      </div>
    </form>
  </div>
</div>
