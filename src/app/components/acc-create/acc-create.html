<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>Criar Conta</h2>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="full_name">Nome completo</label>
        <input 
          id="full_name" 
          formControlName="full_name" 
          type="text" 
          placeholder="Digite seu nome completo"
        />
        <div *ngIf="form.get('full_name')?.invalid && form.get('full_name')?.touched" class="error">
          Nome completo é obrigatório (mínimo 3 caracteres)
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email" 
          formControlName="email" 
          type="email" 
          placeholder="seu@email.com"
        />
        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error">
          Email inválido
        </div>
      </div>

      <div class="form-group">
        <label for="username">Nome de usuário</label>
        <input 
          id="username" 
          formControlName="username" 
          type="text" 
          placeholder="seu_usuario"
        />
        <div *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="error">
          Nome de usuário obrigatório (mínimo 4 caracteres)
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-submit" [disabled]="form.invalid">Criar Conta</button>
      </div>
    </form>
  </div>
</div>
