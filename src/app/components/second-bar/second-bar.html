<section class="second-bar-section">
  <!-- Faixa amarela superior com links -->
  <div class="top-bar">
    <span>Para ti</span>
    <span>Mejores empresas</span>
    <span>Detector de Sitio Confiable</span>
    <span>Comparar</span>
    <span>Descuentos</span>
    <span>Para empresas</span>
  </div>

  <!-- Área principal com fundo amarelo claro -->
  <div class="main-content">
    <!-- Ícone esquerdo (fixo à esquerda) -->
    <div class="logo-left">
      <img src="/icone-01.png" alt="Ícono izquierdo" class="icon-left" />
    </div>

    <!-- Texto central -->
    <div class="center-text">
      <h1>¡QuejaCierta te acerca a las marcas que tienen la confianza del consumidor!</h1>
      <p>
        Compra de forma más segura, investigando empresas y buscando una solución para cualquier problema.
      </p>

      <div class="action-buttons">
        <button class="btn-reclamar" (click)="fazerReclamacao()">
          <span class="icon">📢</span>
          Haz una<br>reclamación
        </button>

        <button class="btn-minhas" (click)="minhasReclamacoes()">
          <span class="icon">📂</span>
          Mis<br>Reclamaciones
        </button>
      </div>
    </div>

    <!-- Ícone direito (fixo à direita) -->
    <div class="logo-right">
      <img src="/icone-01.png" alt="Ícono derecho" class="icon-right" />
    </div>
  </div>
</section>
